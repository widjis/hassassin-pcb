<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hassassin PCB</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="mark">◆</span> Hassassin <span class="dim">PCB</span></div>
      <div class="doc-title" id="docTitle">No board</div>
      <div class="query">
        <input id="query" spellcheck="false" placeholder="Selector, e.g. net[netClass=power] > trace" />
        <span id="queryInfo" class="query-info"></span>
      </div>
      <div class="collab-bar" id="collabBar"></div>
      <div class="actions">
        <button id="undoBtn" title="Undo (Cmd/Ctrl+Z)">↶</button>
        <button id="redoBtn" title="Redo (Shift+Cmd/Ctrl+Z)">↷</button>
        <button id="saveBtn" title="Save as .hpcb (Cmd/Ctrl+S)">Save</button>
        <div class="menu-wrap">
          <button id="fileMenuBtn" title="New, open and export">File ▾</button>
          <div class="menu hidden" id="fileMenu">
            <button id="newBtn" title="Start an empty project">New project</button>
            <label class="menu-item" title="Open a board, schematics (select several files) or a .hpcb project">Open…<input id="fileInput" type="file" accept=".kicad_pcb,.kicad_sch,.hpcb" multiple hidden /></label>
            <button id="fabBtn" title="Download Gerbers, drill, BOM and placement as a ZIP">Export fab files</button>
            <button id="pcbKicadBtn" title="Download the board as a KiCad board file (.kicad_pcb, KiCad 9 / 10) with a .kicad_pro holding its rules, in a ZIP">Export KiCad board (.zip)</button>
            <button id="schKicadBtn" title="Download the schematic as KiCad files (.kicad_sch per sheet, a symbol library and a project file) in a ZIP">Export KiCad schematic (.zip)</button>
            <button id="netExportBtn" title="Download the schematic as a KiCad netlist, for KiCad's PCB editor (File → Import → Netlist)">Export KiCad netlist (.net)</button>
          </div>
        </div>
      </div>
    </header>
    <main class="workspace">
      <aside class="sidebar left">
        <section class="tab-body" id="agentPanel"></section>
      </aside>
      <div class="canvas-wrap" id="canvasWrap">
        <div id="view3d" class="view3d hidden"></div>
        <div class="viewbar">
          <div class="seg" id="spaces">
            <button data-space="schematic" title="Schematic">Schematic</button>
            <button data-space="layout" class="on" title="Board layout">Layout</button>
            <button data-space="3d" id="view3dBtn" title="3D view of the board (3)">3D</button>
          </div>
        </div>
        <nav class="rail" id="rail"></nav>
        <nav class="rail palette hidden" id="schPalette" aria-label="Schematic tools">
          <div class="rail-group" id="schToolSeg">
            <button class="rail-btn on" data-tool="select" title="Select and move (Esc)"></button>
            <button class="rail-btn" data-tool="wire" title="Draw wires (W)"></button>
            <button class="rail-btn" data-tool="bus" title="Draw a bus (B); name it with a label such as DATA[0..7]"></button>
            <button class="rail-btn" data-tool="entry" title="Bus entry (E): click next to a bus where a wire should join it"></button>
          </div>
          <div class="rail-group">
            <button class="rail-btn" id="labelBtn" title="Place a net label at the cursor (L): local, global, or hierarchical inside a sub-sheet"></button>
            <button class="rail-btn" id="subSheetBtn" title="Add a hierarchical sub-sheet block at the cursor; double-click it to open, U to go back up"></button>
            <button class="rail-btn" id="libBtn" title="Search the part library and place a part (P)"></button>
          </div>
        </nav>
        <nav class="rail palette" id="palette" aria-label="Board tools">
          <div class="rail-group">
            <button class="rail-btn" data-mode="select" title="Select and move (S, Esc)"></button>
            <button class="rail-btn" data-mode="route" title="Route tracks (X); while routing the right button or Ctrl+/ steps the corner mode"></button>
          </div>
          <div class="rail-group">
            <button class="rail-btn" data-draw="pour" title="Copper pour (Ctrl+Shift+F): click the corners, drag for a rectangle; Enter or double-click closes"></button>
            <button class="rail-btn" data-draw="keepout" title="Keep-out area (Ctrl+Shift+K): click the corners; then what it forbids"></button>
            <button class="rail-btn" data-draw="outline-poly" title="Board outline, polygon (Ctrl+Shift+P): click the corners; Enter closes"></button>
            <button class="rail-btn" data-draw="outline-rect" title="Board outline, rectangle: drag from corner to corner"></button>
            <button class="rail-btn" data-draw="line" title="Silkscreen line (Ctrl+Shift+L): click the start, then each bend"></button>
            <button class="rail-btn" data-draw="text" title="Text (T): click where it goes"></button>
            <button class="rail-btn" data-draw="hole" title="Mounting hole: click where it goes"></button>
            <button class="rail-btn" data-draw="fiducial" title="Fiducial: click where it goes"></button>
          </div>
          <div class="rail-group">
            <button class="rail-btn" data-mode="measure" title="Measure (Q, Ctrl+Shift+M); select two objects to see their clearance"></button>
            <button class="rail-btn" data-act="delete" title="Delete the selection (Delete)"></button>
          </div>
        </nav>
        <div class="flyout hidden" id="flyout">
          <div class="flyout-head"><span id="flyoutTitle"></span><button id="flyoutClose" title="Close (Esc)">×</button></div>
          <section class="tab-body hidden" data-body="project" id="projectPanel"></section>
          <section class="tab-body hidden" data-body="parts" id="partsPanel"></section>
          <section class="tab-body hidden" data-body="board" id="boardPanel"></section>
          <section class="tab-body hidden" data-body="layers" id="layersPanel"></section>
          <section class="tab-body hidden" data-body="objects">
            <input id="treeFilter" class="filter" placeholder="Filter by name" spellcheck="false" />
            <div id="treePanel" class="tree"></div>
          </section>
          <section class="tab-body hidden" data-body="rules" id="rulesPanel"></section>
          <section class="tab-body hidden" data-body="review" id="reviewPanel"></section>
          <section class="tab-body hidden" data-body="comments" id="commentsPanel"></section>
          <section class="tab-body hidden" data-body="history" id="historyPanel"></section>
          <section class="tab-body hidden" data-body="help" id="helpPanel"></section>
        </div>
        <div class="spacebar">
          <div class="layout-tools" id="layoutTools">
            <button id="unrouteBtn" title="Take routed copper off: the selection (U), the selection's nets (Shift+U), an area, or everything">Unroute ▾</button>
            <button id="autorouteBtn" title="Autoroute: route every unrouted connection (45°, vias, clearances kept), checked with DRC before it is applied; runs in the background, one undo step. Click again to stop. Options in the Board panel.">Autoroute</button>
            <div class="mode-bar" id="routeBar" hidden>
              <div class="seg" id="cornerSeg" title="Corner style of new traces (right mouse button or Ctrl+/ steps through them)"></div>
              <select id="routeModeSel" title="Walkaround: go round other copper · Shove: push other traces aside · Free: no checks (M)"></select>
              <select id="routeWidthSel" title="Trace width (W / Shift+W); the net's rule unless chosen here"></select>
              <select id="routeViaSel" title="Via size (' bigger, \\ smaller, Shift+V next); the net's rule unless chosen here"></select>
            </div>
            <div class="mode-bar" id="drawBar" hidden>
              <select id="bendSel" title="Bend style (EAGLE wire bend): keys 0–7, the right mouse button steps through them, Shift+Space 45°"></select>
              <label class="dim" title="Miter radius at the bend's corner: positive rounds, negative cuts straight (90° bends), 0 sharp">Miter <input id="miterInp" type="number" step="0.1" style="width:56px"> mm</label>
            </div>
            <button id="layerBtn" title="Active copper layer (L)">F.Cu</button>
            <button id="flipBtn" title="View from the other side (F)">Top</button>
            <button id="fitBtn" title="Zoom to fit (Home)">Fit</button>
            <button id="pourBtn" title="Fill / refill the copper pours (B)">Pour</button>
            <button id="unpourBtn" title="Unfill the copper pours, keeping their outlines: the selected pours, or all (Ctrl+B)">Unpour</button>
            <button id="pickBtn" title="What a selection box picks: kinds of item, and the active layer only or every layer">Pick ▾</button>
            <select id="layoutGridSelect" title="Layout grid: where parts, traces and drawings snap"></select>
            <select id="layoutAlignSelect" title="Align or spread the selected parts (traces follow)">
              <option value="">Align…</option>
              <option value="left">Align left</option>
              <option value="right">Align right</option>
              <option value="top">Align top</option>
              <option value="bottom">Align bottom</option>
              <option value="centerX">Align centres (column)</option>
              <option value="centerY">Align centres (row)</option>
              <option value="distributeX">Spread evenly ↔</option>
              <option value="distributeY">Spread evenly ↕</option>
            </select>
          </div>
          <div class="sch-tools" id="schTools">
            <select id="sheetSelect" title="Sheet"></select>
            <select id="partSelect" title="Add a part at the view centre (A)">
              <option value="">+ Part…</option>
            </select>
            <button id="annotateBtn" title="Renumber references (R1, R2 …) in reading order">Annotate</button>
            <select id="alignSelect" title="Align or spread the selected parts">
              <option value="">Align…</option>
              <option value="left">Align left</option>
              <option value="right">Align right</option>
              <option value="top">Align top</option>
              <option value="bottom">Align bottom</option>
              <option value="centerX">Align centres (column)</option>
              <option value="centerY">Align centres (row)</option>
              <option value="distributeX">Spread evenly ↔</option>
              <option value="distributeY">Spread evenly ↕</option>
            </select>
            <select id="gridSelect" title="Schematic grid: where part pins land / where wires snap">
              <option value="1.27/1.27">Grid 1.27</option>
              <option value="2.54/1.27">Grid 2.54 · wire 1.27</option>
              <option value="2.54/2.54">Grid 2.54</option>
              <option value="5.08/1.27">Grid 5.08 · wire 1.27</option>
              <option value="5.08/2.54">Grid 5.08 · wire 2.54</option>
            </select>
            <button id="frameBtn" title="Drawing frame and title block for this sheet">Frame…</button>
            <button id="schExportBtn" title="Export the schematic as PDF or SVG (vector, for printing or sharing)">Export…</button>
            <button id="compactBtn" title="Pack the blocks of this sheet closer together (connections stay)">Compact</button>
            <button id="tidyBtn" title="Straighten wires: re-route bends and line up small parts (connections stay)">Tidy wires</button>
            <button id="syncBtn" class="primary-outline" title="Push schematic connections into the board">Update PCB</button>
            <button id="backBtn" title="Write board changes back into the schematic: renamed references, pin swaps and gate swaps">Update from PCB</button>
          </div>
        </div>
        <canvas id="gl"></canvas>
        <canvas id="overlay"></canvas>
        <canvas id="sch" class="hidden"></canvas>
        <div class="drop-hint" id="dropHint">
          <div>Drop a <b>.kicad_pcb</b> (with its <b>.kicad_sch</b> files) or a <b>.hpcb</b> here — or start with <b>File → New project</b>.</div>
          <button id="restoreBtn" class="hidden"></button>
        </div>
        <div class="statusbar" id="status"></div>
        <div class="msgbar" id="msg"></div>
      </div>
      <aside class="sidebar right" id="inspector"></aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
